name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: npm test
      - name: Instalação real via launcher (cria venv e instala yt-dlp)
        run: node bin/cli.js --data-dir "${{ runner.temp }}/ytkb" doctor
      - name: Pacote npm contém só a whitelist
        shell: bash
        run: |
          npm pack --dry-run --json > pack.json
          python - <<'PY'
          import json
          files = [f["path"] for f in json.load(open("pack.json"))[0]["files"]]
          bad = [f for f in files if f.startswith(("tests/", "knowledge/", "skills/", ".")) or "__pycache__" in f]
          assert not bad, bad
          print(len(files), "arquivos ok")
          PY
