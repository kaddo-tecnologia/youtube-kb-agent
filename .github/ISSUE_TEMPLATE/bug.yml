name: Bug
description: Algo não funciona como esperado
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: O que aconteceu e o que você esperava
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Saída de `npx @kaddo-tecnologia/youtube-kb-agent doctor`
      render: text
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Trecho da telemetria do painel
      render: text
