[project]
name = "youtube-kb-agent"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: precisa de Ollama/YouTube reais (fora do CI)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]
ignore = ["S101", "S603", "S607", "S310", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
